<!-- =========================================================================
     Elvana Media: the default share image (1200 x 630), built from the system.
     The home hero in its still state (the torn corner shows the red poster
     underneath) plus the snipe. build.py injects the site CSS at the marker
     and tools/render-og.js screenshots it to og-default.png. Edit, then run
     python3 build.py (it re-renders when this file or the CSS is newer).
     ========================================================================= -->
