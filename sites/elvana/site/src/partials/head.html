<!doctype html>
<html lang="en-IN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}{{canonical_link}}<meta name="theme-color" content="#1A1814">
<!-- Favicon: a typographic "E" poster, yellow on ink. Inline SVG, no request. -->
<link rel="icon" type="image/svg+xml" href="{{favicon}}">
<!-- Open Graph and Twitter. og:image is absolute (shared links need it); build.py fills every value from the page's front matter. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Elvana Media">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<meta name="twitter:image:alt" content="{{og_image_alt}}">
<!-- Motion gate: html.js always, html.motion unless the visitor prefers reduced motion. Everything animated keys off these. -->
<script>document.documentElement.className='js'+(matchMedia('(prefers-reduced-motion: reduce)').matches?'':' motion');</script>
<!-- Paste-over page transitions (CSS in components.css). Must run before first render, so it lives here:
     Back peels the old page off; any other navigation pastes the new page on behind a squeegee. -->
<script>addEventListener('pagereveal',function(e){var v=e.viewTransition;if(!v)return;var back=false;try{var a=navigation.activation;back=a.navigationType==='traverse'&&!!a.from&&a.entry.index<a.from.index}catch(_){}if(v.types)v.types.add(back?'peel':'paste');if(back)return;var s=document.createElement('i');s.className='vt-squeegee';s.setAttribute('aria-hidden','true');document.documentElement.appendChild(s);var done=function(){s.remove()};v.finished.then(done,done)});</script>
{{styles}}
{{head_scripts}}
<!-- JSON-LD hook: Organization + LocalBusiness (every page), WebPage and BreadcrumbList (per page), then any ld+json script block found in the page body -->
{{jsonld}}
</head>
<body class="{{body_class}}" id="top">
<a class="skip" href="#main">Skip to content</a>
